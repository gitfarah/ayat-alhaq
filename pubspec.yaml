name: quran_app_v1
description: A Quran reading app for Android and iOS.
publish_to: 'none'
version: 1.7.2+73

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  scrollable_positioned_list: ^0.3.8
  flutter_html: ^3.0.0-beta.2
  provider: ^6.1.2
  flutter_svg: ^2.0.10
  path_provider: ^2.1.4
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.14
  device_preview: ^1.3.1
  hijri: ^3.0.0
  geolocator: ^13.0.1
  share_plus: ^13.3.0
  gal: ^2.3.3
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  in_app_review: ^2.0.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device smoke test (integration_test/). Codemagic's QA stage runs
  # `flutter test integration_test` against a simulator and fails the
  # whole build when this dependency is missing, even though every unit
  # test passed.
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# App icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # The master icon's OWN background green, not an approximation of it.
  # The artwork is a full-bleed tile, so any difference between the two
  # greens draws a visible rectangle around it on the home screen.
  adaptive_icon_background: "#064C47"
  # The full master, NOT a pre-shrunk copy of it. This generator already
  # insets the foreground by 16% to fit Android's safe zone; feeding it
  # artwork that had been padded a second time is what left the icon
  # small in the middle of its tile.
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#064D47"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/quran/
    - assets/icon/app_icon.png
    - assets/icon/media_art.png
    - assets/icon/logo.png
    - assets/icon/logo_transparent.png
    - assets/icon/bismillah.png
    - assets/icon/mushaf_illustration.png
  fonts:
    # UI everywhere: menus, labels, buttons, surah lists. The '.SF Pro
    # Text' family (referenced directly in code, not registered here)
    # resolves to Apple's on-device San Francisco font, never bundled —
    # its licence doesn't allow redistribution, and "SF Arabic" isn't a
    # nameable font third-party apps can look up directly.
    # Surah TITLES only — QUL's "Surah name v2", a ligature font in
    # which the string "surah005" becomes the calligraphic
    # "سُورَةُ المَائِدَة" as a printed Mushaf sets it. Nothing else
    # renders: it carries the 114 names and no ordinary letters.
    - family: SurahNameV2
      fonts:
        - asset: assets/fonts/SurahNameV2.ttf
    # Surah TITLES, V4 — the same ligature font the V4 Mushaf heads its
    # pages with, and now the one every surah name in the app is set in
    # (index, reader band, share card). Registered here rather than
    # FontLoader-ed at runtime like it used to be: the index shows surah
    # names before any Mushaf page has ever been opened, so waiting for
    # the Mushaf's own font load would leave the list blank or fall back
    # to raw "surah001" text.
    - family: QUL_Surah_Name_V4
      fonts:
        - asset: assets/fonts/qul_surah_name_v4.ttf
    # Quran VERSES ONLY — the Uthmanic Hafs typeface of the printed Mushaf.
    #
    # KFGQPC HAFS Uthmanic Script v2.2 (2021), the King Fahd Complex's
    # released version, taken from the same QUL/Tarteel CDN this app
    # already fetches its Mushaf page fonts from.
    #
    # It replaced v0.18 — an early beta that could not shape a
    # word-internal hamza: ٱلْءَاخِرَةِ came out broken in two, and the
    # workaround for THAT (re-encoding the hamza onto a connector) came
    # out looking like ٱلْكَاخِرَة, a different word.
    #
    # v2.2 is chosen so the canonical spelling can be set with no
    # rewriting of the text at all. Grounds: it is the King Fahd
    # Complex's released version by the same designer, and carries ~52%
    # more mark-positioning (GPOS) data than the beta — 23,898 vs 15,752
    # bytes — which is the table whose gaps caused this class of bug.
    # The RENDERING itself was confirmed on a device, not in CI: canvas
    # ink measurements could not tell a connected Arabic word from a
    # broken one reliably enough to trust.
    - family: QuranHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs_V22.ttf
