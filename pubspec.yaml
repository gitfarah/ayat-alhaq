name: quran_app_v1
description: A Quran reading app for Android and iOS.
publish_to: 'none'
version: 1.7.3+90

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  scrollable_positioned_list: ^0.3.8
  flutter_html: ^3.0.0-beta.2
  provider: ^6.1.2
  flutter_svg: ^2.0.10
  path_provider: ^2.1.4
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.14
  device_preview: ^1.3.1
  hijri: ^3.0.0
  geolocator: ^13.0.1
  share_plus: ^13.3.0
  gal: ^2.3.3
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  in_app_review: ^2.0.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device smoke test (integration_test/). Codemagic's QA stage runs
  # `flutter test integration_test` against a simulator and fails the
  # whole build when this dependency is missing, even though every unit
  # test passed.
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# App icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # The master icon's OWN background green, not an approximation of it.
  # The artwork is a full-bleed tile, so any difference between the two
  # greens draws a visible rectangle around it on the home screen.
  adaptive_icon_background: "#064C47"
  # The full master, NOT a pre-shrunk copy of it. This generator already
  # insets the foreground by 16% to fit Android's safe zone; feeding it
  # artwork that had been padded a second time is what left the icon
  # small in the middle of its tile.
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#064D47"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/quran/
    - assets/icon/app_icon.png
    - assets/icon/media_art.png
    - assets/icon/logo.png
    - assets/icon/logo_transparent.png
    - assets/icon/bismillah.png
    - assets/icon/mushaf_illustration.png
    # Apple's official "Download on the App Store" badge, drawn into the
    # bottom-left of a shared ayah card. Kept as the SVG Apple ships so
    # it stays sharp at whatever size the card is rendered at, and so it
    # is never redrawn or recoloured — Apple's guidelines do not allow
    # either.
    - assets/icon/app_store_badge.svg
    # The app's wordmark, signed into the bottom-right of a shared ayah
    # card. This is logo_transparent.png with its transparent padding
    # trimmed off — the original is a 2000x2000 square whose ink covers
    # a band about a third of that, so drawn to fit a footer it would
    # have come out tiny with acres of nothing around it.
    - assets/icon/wordmark.png
    # Ornamental sura border, headed over the surah name on a shared
    # card. From Wikipedia: "Sura border" by Hadysylmy, CC BY-SA 4.0.
    # Recoloured per card ground, which makes each drawn frame a
    # derivative — so the licence is carried in the About screen's
    # credits, and the ShareAlike terms travel with it.
    - assets/icon/sura_border.svg
  fonts:
    # UI everywhere: menus, labels, buttons, surah lists. The '.SF Pro
    # Text' family (referenced directly in code, not registered here)
    # resolves to Apple's on-device San Francisco font, never bundled —
    # its licence doesn't allow redistribution, and "SF Arabic" isn't a
    # nameable font third-party apps can look up directly.
    # Surah TITLES only — QUL's "Surah name v2", a ligature font in
    # which the string "surah005" becomes the calligraphic
    # "سُورَةُ المَائِدَة" as a printed Mushaf sets it. Nothing else
    # renders: it carries the 114 names and no ordinary letters.
    - family: SurahNameV2
      fonts:
        - asset: assets/fonts/SurahNameV2.ttf
    # Surah TITLES, V4 — the same ligature font the V4 Mushaf heads its
    # pages with, and now the one every surah name in the app is set in
    # (index, reader band, share card). Registered here rather than
    # FontLoader-ed at runtime like it used to be: the index shows surah
    # names before any Mushaf page has ever been opened, so waiting for
    # the Mushaf's own font load would leave the list blank or fall back
    # to raw "surah001" text.
    - family: QUL_Surah_Name_V4
      fonts:
        - asset: assets/fonts/qul_surah_name_v4.ttf
    # Quran VERSES ONLY — the Uthmani typeface the reader sets ayahs in.
    # (The family is still called QuranHafs: it names the JOB — the Quran
    # body face — not the file behind it, which has changed.)
    #
    # Amiri Quran v1.000, the Quranic cut of the Amiri family, from
    # Google Fonts (SIL OFL 1.1).
    #
    # It must join a word-internal hamza: ٱلْءَاخِرَةِ (2:4) has to set as
    # ٱلْأَخِرَة, the way the KFGQPC Mushaf page itself prints it. Two
    # fonts out of eight tested do that — this one and "me_quran", which
    # this replaced. The other six, INCLUDING both KFGQPC HAFS Uthmanic
    # Script v0.18 and v2.2, split the word in two around the hamza.
    #
    # Amiri was chosen over me_quran on looks, after rendering the same
    # ayah in both side by side: me_quran sets words tight and heavy and
    # needed a word-spacing + ink-opacity crutch to be readable (see the
    # deleted kQuranWordSpacing / kQuranInkOpacity in theme.dart). Amiri
    # Quran is set AS-IS, with no such compensation — if either of those
    # ever comes back, the face was probably swapped without looking.
    #
    # That history matters, because the obvious-looking fixes are all
    # wrong and have each been tried:
    #   * rewriting the hamza onto a connector (tatweel + U+0654) made it
    #     read as ٱلْكَاخِرَة — a different word;
    #   * leaving the canonical spelling on a font that cannot join it
    #     leaves the word visibly broken;
    #   * "upgrade KFGQPC v0.18 to v2.2" sounds right and does nothing —
    #     v2.2 splits it identically. Verified by rendering, after
    #     reasoning from the fonts' GPOS tables gave the wrong answer.
    #
    # So before swapping this font, render ٱلْءَاخِرَةِ in the candidate
    # and LOOK at it. Font-table inspection is not sufficient evidence.
    #
    - family: QuranHafs
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
    # END-OF-AYAH MEDALLIONS ONLY, on the reflowing page.
    #
    # That page prints an ayah number as bare Arabic-Indic digits and
    # relies on the FONT to set them inside the ornate circle, which is
    # the KFGQPC convention. The body face is not asked to: me_quran, the
    # body font when this was split out, drew the digits plain with small
    # square marks above and below — a squashed frame jammed between the
    # words — and did not enclose them for U+06DD either.
    #
    # So the marker keeps a KFGQPC face (v2.2) of its own. Same file that
    # was bundled as the body font for one build; it is kept ONLY for
    # these digits, never for verse text — it splits ٱلْءَاخِرَةِ, which is
    # why it stopped being the body font.
    - family: QuranAyahMark
      fonts:
        - asset: assets/fonts/AyahMarkHafs.ttf
