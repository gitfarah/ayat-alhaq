name: quran_app_v1
description: A Quran reading app for Android and iOS.
publish_to: 'none'
version: 1.3.2+30

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  scrollable_positioned_list: ^0.3.8
  flutter_html: ^3.0.0-beta.2
  provider: ^6.1.2
  flutter_svg: ^2.0.10
  path_provider: ^2.1.4
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.14
  device_preview: ^1.3.1
  hijri: ^3.0.0
  geolocator: ^13.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# App icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#064D47"
  adaptive_icon_foreground: "assets/icon/app_icon_fg_padded.png"
  remove_alpha_ios: true
  background_color_ios: "#064D47"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/quran/
    - assets/icon/media_art.png
    - assets/icon/logo.png
    - assets/icon/logo_transparent.png
    - assets/icon/bismillah.png
  fonts:
    # UI everywhere: menus, labels, buttons, surah lists.
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
    # Quran VERSES ONLY — the Uthmanic Hafs typeface of the printed Mushaf.
    - family: QuranHafs
      fonts:
        - asset: assets/fonts/HafsQuran.ttf
